<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IC Tracker">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<script>window.IC_PWA = true;</script>
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>IC Resource Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky command bar, PAR banner, status summary tiles, then a four-column status board (stacks to one column on phones). */
:root{
  --bg:#e8ecf1;--panel:#ffffff;--panel2:#f2f4f7;--text:#121820;--muted:#4c5664;--border:#c7cfd9;
  --amber:#d97706;--blue:#2563eb;--green:#15803d;--gray:#6b7280;--red:#dc2626;--purple:#7c3aed;
  --scrim:rgba(15,20,28,.55);--toast-bg:#121820;--toast-fg:#ffffff;--toast-btn:#3a4452;--note-bg:rgba(37,99,235,.10);--due-bg:rgba(220,38,38,.10);
  --font-display:"Barlow Condensed","Arial Narrow",-apple-system,sans-serif;
  --font-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--panel:#171c23;--panel2:#212833;--text:#eef2f6;--muted:#95a1ae;--border:#2c3541;
  --amber:#f59e0b;--blue:#3b82f6;--green:#22c55e;--gray:#6b7280;--red:#ef4444;--purple:#a78bfa;
  --scrim:rgba(0,0,0,.6);--toast-bg:#eef2f6;--toast-fg:#0e1116;--toast-btn:#c7cfd9;--note-bg:rgba(59,130,246,.16);--due-bg:rgba(239,68,68,.16);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116;--panel:#171c23;--panel2:#212833;--text:#eef2f6;--muted:#95a1ae;--border:#2c3541;
  --amber:#f59e0b;--blue:#3b82f6;--green:#22c55e;--gray:#6b7280;--red:#ef4444;--purple:#a78bfa;
  --scrim:rgba(0,0,0,.6);--toast-bg:#eef2f6;--toast-fg:#0e1116;--toast-btn:#c7cfd9;--note-bg:rgba(59,130,246,.16);--due-bg:rgba(239,68,68,.16);color-scheme:dark}
/* In-app display override (Settings) wins over the device theme */
:root.app-dark{
  --bg:#0e1116;--panel:#171c23;--panel2:#212833;--text:#eef2f6;--muted:#95a1ae;--border:#2c3541;
  --amber:#f59e0b;--blue:#3b82f6;--green:#22c55e;--gray:#6b7280;--red:#ef4444;--purple:#a78bfa;
  --scrim:rgba(0,0,0,.6);--toast-bg:#eef2f6;--toast-fg:#0e1116;--toast-btn:#c7cfd9;--note-bg:rgba(59,130,246,.16);--due-bg:rgba(239,68,68,.16);color-scheme:dark}
:root.app-light{
  --bg:#e8ecf1;--panel:#ffffff;--panel2:#f2f4f7;--text:#121820;--muted:#4c5664;--border:#c7cfd9;
  --amber:#d97706;--blue:#2563eb;--green:#15803d;--gray:#6b7280;--red:#dc2626;--purple:#7c3aed;
  --scrim:rgba(15,20,28,.55);--toast-bg:#121820;--toast-fg:#ffffff;--toast-btn:#3a4452;--note-bg:rgba(37,99,235,.10);--due-bg:rgba(220,38,38,.10);color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font:16px/1.35 var(--font-body);-webkit-text-size-adjust:100%;padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none}
button:focus-visible,.card-main:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea{font:inherit;font-size:17px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;width:100%;margin-top:4px}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0}
h2.section{font:700 15px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:26px 0 10px}
.muted{color:var(--muted)}
.btn{min-height:46px;padding:0 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.danger-fill{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
@media (prefers-reduced-motion:no-preference){
  .btn:active,.qa:active,.sbtn:active,.mini:active,.type-tile:active,.inc-row:active,.card-main:active,.dept:active,.chip:active{transform:scale(.97)}
}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:42px;height:42px;border-radius:10px;background:var(--red);color:#fff;font:800 20px var(--font-display);display:grid;place-items:center;flex:none}
.title{font:700 24px/1.1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:right;flex:none}
.clock .big{font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums}
.clock .small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.home{padding:8px 16px 40px;max-width:1100px;margin:0 auto}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.type-tile{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ti-icon{font-size:46px;line-height:1}
.ti-label{font:700 22px var(--font-display);text-align:center}
.inc-list{display:flex;flex-direction:column;gap:10px}
.inc-row{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:left;width:100%;flex-wrap:wrap}
.inc-row.closed{opacity:.72}
.ir-icon{font-size:32px}
.ir-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ir-title{font:700 21px var(--font-display)}
.ir-sub{font-size:14px;color:var(--muted)}
.ir-counts{display:flex;gap:6px}
.pill{min-width:34px;height:30px;padding:0 8px;border-radius:15px;background:var(--c);color:var(--fg,#fff);display:inline-grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.note-box{margin-top:28px;padding:14px 16px;border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-size:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note-box span{flex:1;min-width:220px}

.closed-banner{margin:12px 16px 0;padding:12px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.closed-banner b{flex:1}
.par-banner{margin:12px 16px 0;padding:10px 12px 10px 16px;border-radius:12px;background:var(--due-bg);border:2px solid var(--red);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.par-banner .pb-text{flex:1;min-width:200px}
.par-banner .pb-title{font:800 20px var(--font-display);color:var(--red);letter-spacing:.03em}
.par-banner .btn{background:var(--red);border-color:var(--red);color:#fff}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px 16px 0}
.sum{background:var(--panel);border:1px solid var(--border);border-top:5px solid var(--c);border-radius:12px;padding:8px 12px}
.sum .n{font:800 34px/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.sum .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.quickadd{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quickadd::-webkit-scrollbar{display:none}
.qa{flex:none;min-height:48px;padding:0 16px;border-radius:24px;background:var(--panel);border:1px solid var(--border);font-weight:600;white-space:nowrap}
.qa.more{border-style:dashed}
.qa.eoc{border:2px solid var(--red);font-weight:800}
.sync-pill{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--border);background:var(--panel2);font-weight:700;font-size:14px;white-space:nowrap}
.sync-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 16px 40px;align-items:start}
.col{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;min-height:120px;min-width:0}
.col-head{background:var(--c);color:var(--fg,#fff);padding:10px 12px;font:800 18px var(--font-display);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.col-head .cnt{background:rgba(0,0,0,.22);border-radius:12px;padding:0 10px;font-variant-numeric:tabular-nums}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
.card{background:var(--panel2);border:1px solid var(--border);border-left:6px solid var(--c);border-radius:10px}
.card.left-scene{opacity:.65}
.card.par-due{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
@media (prefers-reduced-motion:no-preference){.card.par-due{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--red)}}
.card-main{display:block;width:100%;text-align:left;padding:10px 10px 6px}
.card-top{display:flex;align-items:center;gap:8px}
.abbr{font:800 13px var(--font-display);letter-spacing:.04em;background:var(--border);border-radius:6px;padding:2px 6px;flex:none}
.ma{font:800 12px var(--font-display);letter-spacing:.05em;background:var(--purple);color:#fff;border-radius:6px;padding:2px 6px;flex:none}
.unit{font:800 21px/1.15 var(--font-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pers{font-size:14px;font-weight:700;flex:none}
.card-sub{font-size:13px;color:var(--muted);margin-top:2px}
.assign{font-size:14px;font-weight:600;margin-top:4px}
.card-time{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.card-time b{color:var(--text)}
.par-line{font-size:13px;margin-top:3px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.card.par-due .par-line{color:var(--red)}
.card-actions{display:flex;gap:6px;padding:0 8px 8px}
.mini{flex:1;min-height:40px;border-radius:8px;background:var(--c);color:var(--fg,#fff);font-weight:700;font-size:14px;padding:0 4px}
.mini.par-btn{background:var(--red);color:#fff;flex:1.3}

#modal-root:empty,#confirm-root:empty{display:none}
.backdrop{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px;overflow-y:auto}
#confirm-root .backdrop{z-index:40;align-items:center}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:720px;padding:18px 20px 20px;min-width:0}
.modal.small{max-width:460px}
.modal.small p{font-size:17px;margin:0;line-height:1.45}
.modal h3{margin:0 0 4px;font:700 26px var(--font-display);display:flex;align-items:center;gap:8px}
.modal label,.field{display:block;margin-top:14px;font-size:14px;font-weight:600;color:var(--muted)}
.field-label{display:block;margin-top:16px;font-size:14px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.modal-actions{display:flex;gap:10px;margin-top:20px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.modal-actions .spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 14px;border-radius:21px;background:var(--panel2);border:1px solid var(--border);font-weight:600;font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.st.on{background:var(--c);border-color:var(--c);color:var(--fg)}
.chip.saved{border-style:dashed}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:6px}
.dept{min-height:62px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);border-left:6px solid var(--c,var(--border));text-align:left;padding:7px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.dept .dn{font:700 19px/1.1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dept .ds{font-size:12px;color:var(--muted);font-weight:600;min-height:15px}
.dept.ma-dept{border-left-color:var(--purple)}
.dept.ma-dept[style]{border-left-color:var(--c)}
details.custom{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:0 12px}
details.custom summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.custom[open]{padding-bottom:12px}
.status-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.status-btns.four{grid-template-columns:repeat(4,1fr)}
.sbtn{min-height:64px;border-radius:12px;background:var(--c);color:var(--fg,#fff);font:800 18px/1.15 var(--font-display);padding:6px}
.sbtn.current{outline:4px solid var(--text);outline-offset:2px}
.stepper{display:flex;gap:6px;margin-top:4px}
.stepper button{width:52px;flex:none;border-radius:10px;background:var(--panel2);border:1px solid var(--border);font-size:24px;font-weight:700}
.stepper input{margin:0;text-align:center;font-weight:700}
.check{display:flex!important;align-items:center;gap:10px;color:var(--text)!important}
.check input{width:24px;height:24px;margin:0;flex:none}
.timeline{list-style:none;margin:6px 0 0;padding:0;font-size:15px}
.timeline li{padding:6px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.loglist{list-style:none;margin:10px 0 0;padding:0;max-height:55vh;overflow-y:auto}
.loglist li{padding:8px 4px;border-bottom:1px solid var(--border);display:flex;gap:12px;font-size:15px}
.loglist li .t{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.loglist li.note{background:var(--note-bg)}
.report{white-space:pre-wrap;font:13px/1.45 var(--font-mono);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;margin-top:10px;width:100%;min-height:200px;color:var(--text)}
.roster{list-style:none;padding:0;margin:6px 0 0;max-height:240px;overflow-y:auto}
.roster li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.roster li span{flex:1;min-width:0}
.roster li button{color:var(--red);font-weight:700;min-height:36px;padding:0 10px}
.seg{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(200%);transition:transform .25s;z-index:30;background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100vw - 32px);font-weight:600}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast button{background:var(--toast-btn);color:var(--toast-bg);border-radius:8px;min-height:38px;padding:0 14px;font-weight:700}

@media (max-width:900px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .board{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .status-btns.four{grid-template-columns:repeat(2,1fr)}
  .top-actions .lbl{display:none}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast" role="status"></div>
<input type="file" id="import-file" accept=".json,.txt,application/json,text/plain" hidden>

<script>
(function(){
'use strict';

// ---------- County configuration ----------
// Each home department has these four apparatus, named "<Dept> <Type>" (e.g. "Puckett Engine").
const HOME_DEPTS = ['Cleary','Evergreen','Florence','Lake Harbor','Langford','Leesburg','Monterey','Pelahatchie','Puckett','Reservoir','Robinhood','Shell Rd','Southwest','Star','Walters'];
const DEPT_TYPES = ['engine','brush','tanker','rescue'];
// EOC is tracked by individual staff member plus its own equipment.
// Equipment carries 0 personnel so staff aren't counted twice.
const EOC = {
  name:'EOC',
  staff:['B Ishee','H Squires','J Allen','L Cooper'],
  equip:[{unit:'EOC Drone', rtype:'drone'}, {unit:'EOC Fire Box', rtype:'firebox'}, {unit:'EOC G3 Boat', rtype:'boat'}],
};
const EQUIP_TYPES = ['drone','firebox','boat'];
const MUTUAL = [
  {name:'Scott County Equip',   short:'Scott County'},
  {name:'Simpson County Equip', short:'Simpson County'},
  {name:'Smith County Equip',   short:'Smith County'},
];

const STATUSES = [
  {key:'enroute', label:'En Route',           short:'En Route', color:'var(--amber)', fg:'#1a1200'},
  {key:'staging', label:'On Scene – Staging', short:'Staging',  color:'var(--blue)',  fg:'#fff'},
  {key:'working', label:'On Scene – Working', short:'Working',  color:'var(--green)', fg:'#fff'},
  {key:'left',    label:'Left Scene',         short:'Left',     color:'var(--gray)',  fg:'#fff'},
];
const ST = Object.fromEntries(STATUSES.map(s => [s.key, s]));
const ON_SCENE = ['staging', 'working'];

// short = word used in auto-generated unit names; pers = default personnel
const RTYPES = {
  engine:   {label:'Engine',             short:'Engine',    abbr:'E',   pers:3},
  brush:    {label:'Brush Truck',        short:'Brush',     abbr:'BR',  pers:2},
  tanker:   {label:'Tanker',             short:'Tanker',    abbr:'T',   pers:1},
  rescue:   {label:'Rescue',             short:'Rescue',    abbr:'R',   pers:2},
  ladder:   {label:'Ladder / Truck',     short:'Ladder',    abbr:'L',   pers:3},
  ambulance:{label:'Ambulance',          short:'Ambulance', abbr:'A',   pers:2},
  command:  {label:'Chief / Command',    short:'Command',   abbr:'C',   pers:1},
  pov:      {label:'POV Volunteer',      short:'POV',       abbr:'POV', pers:1},
  law:      {label:'Law Enforcement',    short:'LE',        abbr:'LE',  pers:1},
  dozer:    {label:'Dozer / Forestry',   short:'Dozer',     abbr:'DZ',  pers:1},
  air:      {label:'Air / Helicopter',   short:'Air',       abbr:'AIR', pers:2},
  hazmat:   {label:'Hazmat',             short:'HazMat',    abbr:'HM',  pers:2},
  utility:  {label:'Utility / Public Works', short:'Utility', abbr:'U', pers:1},
  drone:    {label:'Drone',              short:'Drone',     abbr:'UAS', pers:0},
  boat:     {label:'Boat',               short:'Boat',      abbr:'BOAT',pers:0},
  firebox:  {label:'Fire Box',           short:'Fire Box',  abbr:'FB',  pers:0, hidden:true},
  eocstaff: {label:'EOC Staff',          short:'EOC',       abbr:'EOC', pers:1, hidden:true},
  other:    {label:'Other',              short:'Unit',      abbr:'O',   pers:1},
};

const COMMON_NOTES = ['PAR complete','Command established','Command transferred','Incident under control','Utilities secured','All units released'];
const ITYPES = {
  structure:{label:'Structure Fire', icon:'🏠', quick:['engine','tanker','rescue','brush','ladder','ambulance','command','pov','law','utility'],
    assign:['Fire Attack','Backup Line','Water Supply','Search','Ventilation','RIT','Exposure Protection','Rehab','Medical','Overhaul','Div A','Div B','Div C','Div D'],
    notes:['Primary search all clear','Secondary search all clear','Fire knocked down','Loss stop','Overhaul complete']},
  wildland: {label:'Wildland Fire', icon:'🌲', quick:['brush','tanker','engine','dozer','pov','command','air','law','ambulance','rescue'],
    assign:['Head','Left Flank','Right Flank','Div A','Div Z','Structure Protection','Water Supply','Mop-up','Line Construction','Rehab','Medical'],
    notes:['Forward progress stopped','Fire contained','Mop-up underway','Structures threatened','Forestry Commission notified']},

const QUICK = {enroute:['staging','working'], staging:['working','left'], working:['staging','left'], left:['staging']};

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const fmtTime = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDate = t => new Date(t).toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'});
function fmtDur(ms, withSecs){
  const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  if (withSecs) return h + ':' + pad(m) + ':' + pad(s % 60);
  return h ? h + 'h ' + pad(m) + 'm' : m + 'm';
}
const stStyle = k => `--c:${ST[k].color};--fg:${ST[k].fg}`;
const rt = r => RTYPES[r.rtype] || RTYPES.other;
const itype = i => ITYPES[i.type] || ITYPES.other;

// ---------- Storage (this browser / app only) ----------
const KEY = 'icTracker.v1';
const DEFAULT_SETTINGS = {icName:'', org:'', theme:'auto', parMin:20, parSound:true, addStatus:'enroute'};
const DEFAULTS = {incidents:[], roster:[], view:{screen:'home'}, settings:DEFAULT_SETTINGS};
let storageOK = true;
let S = load();
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.incidents)) return {...DEFAULTS, ...d, settings:{...DEFAULT_SETTINGS, ...d.settings}};
  } catch (e) { storageOK = false; }
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function persistLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; toast('Not saved: storage is blocked. Use Settings → Backup to copy your data.'); }
}
function save(){ persistLocal(); flush(); }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}

let view = S.view || {screen:'home'};
const inc = () => S.incidents.find(i => i.id === view.id);
const findRes = id => { const i = inc(); return i && i.resources.find(r => r.id === id); };
function go(v){ view = v; S.view = v; save(); closeModal(); render(); window.scrollTo(0, 0); }
function addLog(i, text, isNote){
  const e = {id:uid(), at:now(), text, note:!!isNote}, by = myName();
  if (by) e.by = by;
  i.log.push(e);
  return e;
}
// Older saved data has log entries without ids; sync needs one on every entry.
function normalize(i){ i.resources = i.resources || []; i.log = i.log || []; i.log.forEach(l => { if (!l.id) l.id = uid(); }); }
S.incidents.forEach(normalize);

function counts(i){
  const c = {enroute:0, staging:0, working:0, left:0, personnel:0, totalPers:0, ma:0};
  i.resources.forEach(r => {
    c[r.status]++;
    c.totalPers += +r.personnel || 0;
    if (r.ma) c.ma++;
    if (ON_SCENE.includes(r.status)) c.personnel += +r.personnel || 0;
  });
  return c;
}
function times(r){
  const arr = r.history.find(h => ON_SCENE.includes(h.status));
  return {arrived: arr && arr.at, left: r.status === 'left' ? r.statusAt : null};
}

// ---------- PAR ----------
const parMs = () => (+S.settings.parMin || 0) * 60000;
const parBase = r => r.parAt || r.statusAt;
const hasCrew = r => (+r.personnel || 0) > 0;
const isDue = (i, r, t) => parMs() > 0 && !i.closedAt && r.status === 'working' && hasCrew(r) && (t || now()) - parBase(r) >= parMs();
const dueList = (i, t) => i.resources.filter(r => isDue(i, r, t));
let lastDueKey = '', lastDueInc = null;

let actx = null;
function unlockAudio(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function beep(){
  if (!S.settings.parSound || !actx) return;
  try {
    [0, 0.35].forEach(off => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + off;
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
      o.start(t0); o.stop(t0 + 0.3);
    });
  } catch (e) {}
}

function applyTheme(){
  const el = document.documentElement;
  el.classList.toggle('app-dark', S.settings.theme === 'dark');
  el.classList.toggle('app-light', S.settings.theme === 'light');
}

// ---------- Rendering ----------
function render(){
  applyTheme();
  const app = $('#app');
  if (view.screen === 'incident' && inc()) {
    const i = inc();
    lastDueKey = dueList(i).map(r => r.id).join(',');
    lastDueInc = i.id;
    app.innerHTML = incidentHTML(i);
  } else { view = {screen:'home'}; lastDueInc = null; app.innerHTML = homeHTML(); }
  tick();
  wakeLock(view.screen === 'incident');
}

    </div>

  </header>

    ${closed.length ? `<h2 class="section">Closed incidents</h2><div class="inc-list">${closed.map(incRow).join('')}</div>` : ''}
    <div class="note-box">
      <span>${storageOK ? 'Incidents are saved on this device only.' : 'Storage is blocked here, so incidents will be lost when you close the page.'} Use Settings → Backup to keep a copy.</span>
      ${S.incidents.length ? '' : '<button class="btn" data-action="sample">Open a sample incident</button>'}
    </div>
  </main>`;
}

function incRow(i){
  const c = counts(i), t = itype(i);
  return `

  </button>`;
}

function incidentHTML(i){
  const c = counts(i), t = itype(i), due = dueList(i);
  return `
  <header class="topbar">
    <button class="btn ghost" data-action="home" aria-label="All incidents">‹ <span class="lbl">Incidents</span></button>

  ${due.length ? `<div class="par-banner" role="alert">

function column(i, s){
  const list = i.resources.filter(r => r.status === s.key);
  list.sort((a, b) => s.key === 'left' ? b.statusAt - a.statusAt : a.statusAt - b.statusAt);

    <div class="col-body">${list.length ? list.map(r => card(i, r)).join('') : `<div class="empty">None</div>`}</div>
  </section>`;
}

function card(i, r){
  const s = ST[r.status], t = rt(r), due = isDue(i, r);
  const showPar = r.status === 'working' && parMs() > 0 && !i.closedAt && hasCrew(r);
  const showPers = hasCrew(r) || !EQUIP_TYPES.includes(r.rtype);
  return `
  <div class="card ${r.status === 'left' ? 'left-scene' : ''} ${due ? 'par-due' : ''}" style="${stStyle(r.status)}">

      <div class="card-top"><span class="abbr">${t.abbr}</span><span class="unit">${esc(r.unit)}</span>${r.ma ? '<span class="ma">MA</span>' : ''}${showPers ? `<span class="pers">👤 ${+r.personnel || 0}</span>` : ''}</div>

      ${r.assignment ? `<div class="assign">📍 ${esc(r.assignment)}</div>` : ''}
      <div class="card-time">${s.short} ${fmtTime(r.statusAt)} · <b data-since="${r.statusAt}"></b></div>

      ${QUICK[r.status].map(k => `<button class="mini" style="${stStyle(k)}" data-action="set-status" data-id="${r.id}" data-status="${k}">${r.status === 'left' ? '↩ Returned' : '→ ' + ST[k].short}</button>`).join('')}
    </div>

}

// ---------- Live timers ----------
function tick(){
  const t = now(), pm = parMs();
  document.querySelectorAll('[data-since]').forEach(el => { el.textContent = fmtDur(t - +el.dataset.since); });
  document.querySelectorAll('[data-par]').forEach(el => {
    const rem = pm - (t - +el.dataset.par);
    el.textContent = rem > 0 ? 'due in ' + fmtDur(rem + 59999) : 'DUE — ' + fmtDur(-rem) + ' overdue';
  });
  document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = fmtDur((+el.dataset.end || t) - +el.dataset.elapsed, true); });
  document.querySelectorAll('[data-clock]').forEach(el => el.textContent = fmtTime(t));
  // A unit just became PAR-due: redraw (banner + buttons) and sound the alert
  if (view.screen === 'incident' && inc()) {
    const i = inc(), key = dueList(i, t).map(r => r.id).join(',');
    if (key !== lastDueKey) {
      const prev = lastDueKey.split(','), fresh = key && key.split(',').some(id => !prev.includes(id));
      const same = lastDueInc === i.id;
      render();
      if (fresh && same) beep();
    }
  }
}
setInterval(tick, 1000);

let lock = null;
async function wakeLock(want){
  try {
    if (want && !lock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } else if (!want && lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeLock(view.screen === 'incident'); tick(); } });

// ---------- Modals, confirm, toast ----------
let mctx = {};
function openModal(html){ $('#modal-root').innerHTML = `<div class="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $('#modal-root').innerHTML = ''; mctx = {}; }
function ask(msg, okLabel, danger){
  return new Promise(res => {
    const root = $('#confirm-root');
    root.innerHTML = `<div class="backdrop"><div class="modal small" role="alertdialog" aria-modal="true">
      <p>${esc(msg).replace(/\n/g, '<br>')}</p>
      <div class="modal-actions"><button class="btn" id="cf-no">Cancel</button><button class="btn ${danger ? 'danger-fill' : 'primary'}" id="cf-yes">${esc(okLabel)}</button></div></div></div>`;
    const done = v => { root.innerHTML = ''; res(v); };
    root.querySelector('#cf-no').onclick = () => done(false);
    root.querySelector('#cf-yes').onclick = () => done(true);
    root.querySelector('#cf-yes').focus();
  });
}
let toastTimer, undoState = null;
function toast(msg, withUndo){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button data-action="undo">Undo</button>' : ''}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); if (withUndo) undoState = null; }, withUndo ? 6000 : 2800);
}
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
async function copyText(text, fallbackEl){
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch (e) {
    if (fallbackEl) { fallbackEl.focus(); fallbackEl.select && fallbackEl.select(); }
    toast('Copy was blocked. The text is selected; tap and hold to copy it.');
  }
}

// ---------- Resource changes ----------
function setStatus(i, r, status){
  if (r.status === status) return;
  undoState = {kind:'status', incId:i.id, resId:r.id, status:r.status, statusAt:r.statusAt, parAt:r.parAt, hist:r.history.length};
  const from = r.status;
  r.status = status; r.statusAt = now();
  if (status === 'working') r.parAt = r.statusAt;
  r.history.push({status, at:r.statusAt});
  undoState.logId = addLog(i, `${r.unit}: ${ST[from].short} → ${ST[status].label}`).id;
  save(); render();
  toast(`${r.unit} → ${ST[status].label}`, true);
}

function createResource(i, o){
  const t = now(), status = o.status;
  const r = {id:uid(), rtype:o.rtype, unit:o.unit, agency:o.agency || '', personnel:o.personnel, ma:!!o.ma,
             assignment:o.assignment || '', notes:'', status, statusAt:t, addedAt:t, history:[{status, at:t}]};
  if (status === 'working') r.parAt = t;
  undoState = {kind:'add', incId:i.id, resId:r.id};
  i.resources.push(r);
  undoState.logId = addLog(i, `${r.unit}${r.agency && !r.unit.startsWith(r.agency) ? ' (' + r.agency + ')' : ''}${r.ma ? ' [mutual aid]' : ''} added — ${ST[status].label}, ${r.personnel} personnel`).id;
  save(); render();
  toast(`${r.unit} added — ${ST[status].label}`, true);
  return r;
}

function nameTaken(i, name){ name = name.toLowerCase(); return i.resources.some(r => r.unit.toLowerCase() === name); }
function nextName(i, base, plain){
  if (plain && !nameTaken(i, base)) return base;
  for (let n = plain ? 2 : 1; ; n++) if (!nameTaken(i, `${base} ${n}`)) return `${base} ${n}`;
}

function confirmPar(i, list){
  const t = now();
  list.forEach(r => { r.parAt = t; });
  addLog(i, `PAR confirmed: ${list.map(r => `${r.unit} (${+r.personnel || 0})`).join(', ')}`);
  save(); render();
  toast(list.length === 1 ? `PAR confirmed — ${list[0].unit}` : `PAR confirmed for ${list.length} units`);
}

// ---------- Shared board (Firebase sync) ----------
// Each incident is one cloud document: {meta, resources:{id:…}, log:{id:…}}.
// Changes are pushed per field ("resources.<id>", "log.<id>", "meta"), so two people editing
// different units never overwrite each other. `synced` remembers the last cloud version of every
// part; comparing it with local data tells us what changed here (push) vs. there (pull).
// Firestore queues writes made with no signal and sends them when the connection returns.
const FB_VER = '10.12.2';
const WINDOW_DAYS = 90;           // live-sync incidents started within this many days
const SYNC_KEY = 'icTracker.synced';
const sync = {adapter:null, email:null, unsub:null, ready:false, state:'off', detail:'', synced:{}};
try { sync.synced = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) {}
function saveSynced(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync.synced)); } catch (e) {} }
function testAdapter(){ try { return window.frameElement && window.frameElement.icAdapter; } catch (e) { return null; } }
function myName(){ return S.settings.myName || (sync.email ? sync.email.split('@')[0] : ''); }

// Stable JSON (sorted keys) so local and cloud copies compare equal
function SJ(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(SJ).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + SJ(v[k])).join(',') + '}';
}
function parts(i){
  const p = {}, meta = {};
  Object.keys(i).forEach(k => { if (k !== 'resources' && k !== 'log' && k[0] !== '_') meta[k] = i[k]; });
  p.meta = SJ(meta);
  i.resources.forEach(r => { p['resources.' + r.id] = SJ(r); });
  i.log.forEach(l => { p['log.' + l.id] = SJ(l); });
  return p;
}
function remoteParts(d){
  const p = {meta:SJ(d.meta || {})};
  Object.keys(d.resources || {}).forEach(id => { p['resources.' + id] = SJ(d.resources[id]); });
  Object.keys(d.log || {}).forEach(id => { p['log.' + id] = SJ(d.log[id]); });
  return p;
}
function docFromParts(p){
  const d = {meta:JSON.parse(p.meta), resources:{}, log:{}};
  Object.keys(p).forEach(k => {
    const [kind, id] = k.split('.');
    if (id) d[kind][id] = JSON.parse(p[k]);
  });
  return d;
}
// Update objects in place so code holding a reference keeps working
function reuse(list, out, prefix){
  const byId = Object.fromEntries(list.map(x => [x.id, x]));
  return Object.keys(out).filter(k => k.startsWith(prefix)).map(k => {
    const v = JSON.parse(out[k]), o = byId[v.id] || {};
    Object.keys(o).forEach(key => { if (!(key in v)) delete o[key]; });
    return Object.assign(o, v);
  });
}

// Three-way merge of one cloud document into local data. Returns true if local data changed.
function mergeIncident(id, data){
  const base = sync.synced[id] || {}, rp = remoteParts(data);
  let loc = S.incidents.find(i => i.id === id);
  const lp = loc ? parts(loc) : {}, out = {};
  let changed = false;
  new Set([...Object.keys(base), ...Object.keys(lp), ...Object.keys(rp)]).forEach(k => {
    const b = base[k], l = lp[k], r = rp[k];
    const v = l === b ? r : l;          // unchanged here → take theirs; changed here → keep ours (pushed next)
    if (v !== l) changed = true;
    if (v !== undefined) out[k] = v;
  });
  sync.synced[id] = rp;
  if (!changed || !out.meta) return changed;
  const meta = JSON.parse(out.meta);
  if (!loc) { loc = {resources:[], log:[]}; S.incidents.push(loc); }
  Object.keys(loc).forEach(k => { if (k !== 'resources' && k !== 'log' && !(k in meta)) delete loc[k]; });
  Object.assign(loc, meta);
  loc.resources = reuse(loc.resources, out, 'resources.').sort((a, b) => a.addedAt - b.addedAt);
  loc.log = reuse(loc.log, out, 'log.').sort((a, b) => a.at - b.at);
  return true;
}

// Push everything that differs from the last known cloud version
function flush(){
  const A = sync.adapter;
  if (!A || !sync.ready || !sync.email) return;
  const localIds = new Set();
  S.incidents.forEach(i => {
    localIds.add(i.id);
    const lp = parts(i), base = sync.synced[i.id];
    if (!base) { A.set(i.id, docFromParts(lp)).catch(writeError); sync.synced[i.id] = lp; return; }
    const upd = {};
    let n = 0;
    new Set([...Object.keys(lp), ...Object.keys(base)]).forEach(k => {
      if (lp[k] !== base[k]) { upd[k] = lp[k] === undefined ? A.del : JSON.parse(lp[k]); n++; }
    });
    if (n) { A.update(i.id, upd).catch(writeError); sync.synced[i.id] = lp; }
  });
  Object.keys(sync.synced).forEach(id => {
    if (!localIds.has(id)) { A.remove(id).catch(writeError); delete sync.synced[id]; }
  });
  saveSynced();
}
function writeError(e){
  setSyncState('error', e && e.code === 'permission-denied' ? 'denied' : '');
  toast(e && e.code === 'permission-denied' ? 'The shared board refused this change. Your account may not have access.' : 'A change could not be sent to the shared board.');
}

function onRemote(docs, meta, cutoff){
  let changed = false;
  const ids = new Set();
  docs.forEach(d => { ids.add(d.id); if (mergeIncident(d.id, d.data)) changed = true; });
  // Only a confirmed server answer can tell us an incident was deleted elsewhere
  if (!meta.fromCache) {
    S.incidents.slice().forEach(i => {
      if (sync.synced[i.id] && !ids.has(i.id) && i.startedAt >= cutoff) {
        S.incidents = S.incidents.filter(x => x !== i);
        delete sync.synced[i.id];
        changed = true;
      }
    });
  }
  sync.ready = true;
  flush();
  persistLocal(); saveSynced();
  setSyncState(meta.fromCache ? 'offline' : meta.pending ? 'sending' : 'live');
  if (changed) {
    if (view.screen === 'incident' && !inc()) { view = {screen:'home'}; S.view = view; closeModal(); }
    render(); refreshAdd();
  }
}

function stopListening(){ if (sync.unsub) { sync.unsub(); sync.unsub = null; } sync.ready = false; }

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}
async function firebaseAdapter(cfg){
  if (!window.firebase) {
    for (const m of ['app', 'auth', 'firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
  }
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  const db = firebase.firestore();
  try { await db.enablePersistence({synchronizeTabs:true}); } catch (e) {}
  const auth = firebase.auth(), col = db.collection('incidents');
  return {
    del: firebase.firestore.FieldValue.delete(),
    onAuth: cb => auth.onAuthStateChanged(u => cb(u ? u.email : null)),
    signIn: (email, pw) => auth.signInWithEmailAndPassword(email, pw),
    signOut: () => auth.signOut(),
    listen: (cutoff, onSnap, onErr) => col.where('meta.startedAt', '>=', cutoff).onSnapshot({includeMetadataChanges:true},
      snap => onSnap(snap.docs.map(d => ({id:d.id, data:d.data()})), {fromCache:snap.metadata.fromCache, pending:snap.metadata.hasPendingWrites}), onErr),
    set: (id, data) => col.doc(id).set(data),
    update: (id, fields) => col.doc(id).update(fields),
    remove: id => col.doc(id).delete(),
  };
}

async function startSync(){
  const cfg = window.IC_FIREBASE, test = testAdapter();
  if (!cfg && !test) return;
  setSyncState('connecting');
  try { sync.adapter = test || await firebaseAdapter(cfg); }
  catch (e) { setSyncState('unavailable'); return; }
  sync.adapter.onAuth(email => {
    stopListening();
    sync.email = email;
    if (!email) { setSyncState('signedout'); return; }
    setSyncState('connecting');
    const cutoff = now() - WINDOW_DAYS * 86400000;
    sync.unsub = sync.adapter.listen(cutoff, (docs, meta) => onRemote(docs, meta, cutoff),
      err => setSyncState('error', err && err.code === 'permission-denied' ? 'denied' : ''));
  });
}

function setSyncState(state, detail){
  sync.state = state; sync.detail = detail || '';
  document.querySelectorAll('[data-sync]').forEach(el => { el.innerHTML = syncPill(); });
}
function syncPill(){
  const m = {
    connecting:['var(--gray)', 'Connecting…'], live:['var(--green)', 'Live'], sending:['var(--amber)', 'Sending…'],
    offline:['var(--amber)', 'Offline · will sync'], signedout:['var(--gray)', 'Not signed in'],
    error:['var(--red)', sync.detail === 'denied' ? 'No access' : 'Sync problem'], unavailable:['var(--gray)', 'Sync unavailable'],
  }[sync.state];
  return m ? `<button class="sync-pill" data-action="settings" style="--c:${m[0]}"><span class="dot"></span>${m[1]}</button>` : '';
}
function syncSettingsHTML(){
  if (sync.state === 'off') return '';
  if (!sync.adapter) return `<span class="field-label">Shared board</span><div class="muted" style="margin-top:6px">Couldn't reach the shared board. Connect to the internet and reopen the app.</div>`;
  if (!sync.email) return `
    <span class="field-label">Shared board — sign in to share this board live with the EOC</span>
    <div class="grid2">
      <label>Email<input id="sy-email" type="email" autocomplete="username" autocapitalize="off" autocorrect="off"></label>
      <label>Password<input id="sy-pw" type="password" autocomplete="current-password"></label>
    </div>
    <div class="modal-actions" style="justify-content:flex-start"><button class="btn primary" data-action="sync-signin">Sign in</button></div>`;
  return `
    <span class="field-label">Shared board</span>
    <div class="seg" style="align-items:center"><span style="flex:1;min-width:200px">Signed in as <b>${esc(sync.email)}</b></span>${syncPill()}<button class="btn" data-action="sync-signout">Sign out</button></div>
    <label>Your name in the log<input id="s-me" value="${esc(S.settings.myName || '')}" placeholder="${esc(sync.email.split('@')[0])}" autocomplete="off"></label>`;
}

// ---------- Actions ----------
const actions = {
  'home': () => go({screen:'home'}),
  'settings': settingsModal,
  'close-modal': () => { closeModal(); },
  'sample': sampleIncident,
  'new-incident': b => newIncidentModal(b.dataset.type),
  'create-incident': b => {
    const type = b.dataset.type, ic = val('f-ic');
    const i = {id:uid(), type, name:val('f-name'), ic, notes:'', startedAt:now(), closedAt:null, resources:[], log:[]};
    addLog(i, `Incident started — ${ITYPES[type].label}${i.name ? ' at ' + i.name : ''}${ic ? '. IC: ' + ic : ''}`);
    S.incidents.push(i);
    if (ic) S.settings.icName = ic;
    go({screen:'incident', id:i.id});
  },
  'open-incident': b => go({screen:'incident', id:b.dataset.id}),
  'add': b => addModal(b.dataset.rtype),
  'pick-type': b => addModal(b.dataset.rtype),
  'add-status': b => { S.settings.addStatus = b.dataset.v; save(); $('#status-chips').innerHTML = statusChips(); },
  'add-dept': b => addFromDept(b.dataset.name, !!b.dataset.ma),
  'add-eoc': eocModal,
  'add-eoc-item': b => addEocItem(b.dataset.unit, b.dataset.rtype),
  'add-saved': b => {
    const i = inc(), u = S.roster.find(x => x.unit === b.dataset.unit);
    if (!u) return;
    u.lastUsed = now();
    createResource(i, {rtype:u.rtype, unit:u.unit, agency:u.agency, personnel:u.personnel ?? RTYPES[u.rtype].pers, ma:u.ma, status:S.settings.addStatus || 'enroute'});
    refreshAdd();
  },
  'add-custom': async () => {
    const i = inc(), unit = val('f-unit');
    if (!unit) { const f = $('#f-unit'); f.focus(); toast('Type a unit ID or name first'); return; }
    const dup = i.resources.find(r => r.unit.toLowerCase() === unit.toLowerCase() && r.status !== 'left');
    if (dup && !(await ask(`${dup.unit} is already on this incident (${ST[dup.status].label}). Add it again?`, 'Add again'))) return;
    const r = createResource(i, {rtype:mctx.rtype, unit, agency:val('f-agency'), personnel:Math.max(0, parseInt(val('f-pers')) || 0),
                                 ma:$('#f-ma').checked, status:S.settings.addStatus || 'enroute'});
    rememberUnit(r); save();
    $('#f-unit').value = '';
    refreshAdd();
  },
  'step': b => {
    const inp = b.parentElement.querySelector('input');
    inp.value = Math.max(0, (parseInt(inp.value) || 0) + +b.dataset.d);
  },
  'resource': b => { const r = findRes(b.dataset.id); if (r) resourceModal(r); },
  'pick-assign': b => {
    $('#e-assign').value = b.dataset.v;
    document.querySelectorAll('#assign-chips .chip').forEach(c => c.classList.toggle('on', c === b));
  },
  'set-status': b => {
    const i = inc(), r = findRes(b.dataset.id);
    if (!r) return;
    if (b.dataset.fromModal) { applyResourceFields(i, r); closeModal(); if (r.status === b.dataset.status) { save(); render(); return; } }
    setStatus(i, r, b.dataset.status);
  },
  'save-resource': b => { const i = inc(), r = findRes(b.dataset.id); if (!r) return; applyResourceFields(i, r); save(); closeModal(); render(); },
  'delete-resource': async b => {
    const i = inc(), r = findRes(b.dataset.id);
    if (!r || !(await ask(`Remove ${r.unit} from this incident entirely?\n\nIf the unit simply left, mark it "Left Scene" instead. Removing deletes its record.`, 'Remove', true))) return;
    i.resources = i.resources.filter(x => x !== r);
    addLog(i, `${r.unit} removed from incident (entered in error)`);
    save(); closeModal(); render();
  },
  'par': b => { const i = inc(), r = findRes(b.dataset.id); if (r) confirmPar(i, [r]); },
  'par-all': () => { const i = inc(), due = dueList(i); if (due.length) confirmPar(i, due); },
  'undo': () => {
    const u = undoState;
    $('#toast').classList.remove('show');
    if (!u) return;
    const i = S.incidents.find(x => x.id === u.incId), r = i && i.resources.find(x => x.id === u.resId);
    if (!r) return;
    if (u.kind === 'add') {
      i.resources = i.resources.filter(x => x !== r);
      i.log = i.log.filter(l => l.id !== u.logId);
      undoState = null; save(); render(); refreshAdd();
      toast(`Undone: ${r.unit} removed`);
      return;
    }
    r.status = u.status; r.statusAt = u.statusAt; r.parAt = u.parAt; r.history.length = u.hist; i.log = i.log.filter(l => l.id !== u.logId);
    undoState = null; save(); render(); refreshAdd();
    toast(`Undone: ${r.unit} back to ${ST[r.status].label}`);
  },
  'note': noteModal,
  'log': logModal,
  'quick-note': b => { addLog(inc(), b.dataset.v, true); save(); closeModal(); toast('Logged: ' + b.dataset.v); },
  'add-note': b => {
    const text = val('f-note');
    if (!text) return;
    addLog(inc(), text, true); save();
    if (b.dataset.keep) logModal(); else { closeModal(); toast('Note added to log'); }
  },
  'report': reportModal,
  'copy-report': () => copyText(mctx.report, $('#report-text')),
  'share-report': () => { const i = inc(); navigator.share({title:(i.name || itype(i).label) + ' — Incident Report', text:mctx.report}).catch(() => {}); },
  'close-incident': async () => {
    const i = inc(), c = counts(i), still = c.enroute + c.staging + c.working;
    if (!(await ask(still ? `${still} resource(s) are not marked "Left Scene".\n\nClose the incident anyway?` : 'Close this incident?', 'Close incident', true))) return;
    i.closedAt = now();
    addLog(i, 'Incident closed');
    save(); render(); reportModal();
  },
  'reopen-incident': () => { const i = inc(); i.closedAt = null; addLog(i, 'Incident reopened'); save(); render(); },
  'delete-incident': async () => {
    const i = inc();
    if (!(await ask(`Permanently delete "${i.name || itype(i).label}" and its entire log?${sync.email ? ' It will be deleted for everyone on the shared board.' : ''} This cannot be undone.`, 'Delete', true))) return;
    S.incidents = S.incidents.filter(x => x !== i);
    go({screen:'home'});
  },
  'theme': b => {
    S.settings.theme = b.dataset.v; applyTheme();
    b.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
    save();
  },
  'save-settings': () => {
    Object.assign(S.settings, {icName:val('s-ic'), org:val('s-org'), parMin:Math.max(0, parseInt(val('s-par')) || 0), parSound:$('#s-sound').checked});
    if ($('#s-me')) S.settings.myName = val('s-me');
    save(); closeModal(); render(); toast('Settings saved');
  },
  'del-roster': b => { S.roster = S.roster.filter(u => u.unit !== b.dataset.unit); save(); settingsModal(); },
  'backup': backupModal,
  'copy-backup': () => copyText($('#backup-text').value, $('#backup-text')),
  'restore-text': () => {
    try { mergeBackup($('#backup-text').value); }
    catch (e) { toast('That text is not a valid tracker backup. Paste the full backup and try again.'); }
  },
  'import-file': () => $('#import-file').click(),
  'export-file': async () => {
    const name = `ic-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const blob = new Blob([backupText()], {type:'application/json'});
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:'IC Tracker backup'}); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  'erase-all': async () => {
    if (sync.email) {
      // Signed in: only clear this device; the shared board is untouched.
      if (!(await ask('Sign out and clear all incidents from THIS device?\n\nThe shared board is not affected. Signing back in downloads it again.', 'Sign out and clear', true))) return;
      stopListening();
      await sync.adapter.signOut().catch(() => {});
      sync.synced = {}; saveSynced();
      S = JSON.parse(JSON.stringify(DEFAULTS));
      persistLocal(); go({screen:'home'});
      return;
    }
    if (!(await ask('Erase ALL incidents, logs and saved units from this device?', 'Erase everything', true))) return;
    if (!(await ask('This cannot be undone. Copy a backup first if you need one. Erase now?', 'Yes, erase', true))) return;
    S = JSON.parse(JSON.stringify(DEFAULTS));
    save(); go({screen:'home'});
  },
  'sync-signin': () => {
    const email = val('sy-email'), pw = $('#sy-pw').value;
    if (!email || !pw) { toast('Enter your email and password'); return; }
    sync.adapter.signIn(email, pw)
      .then(() => { closeModal(); toast('Signed in. Connecting to the shared board…'); })
      .catch(() => toast('Sign-in failed. Check the email and password, and that you have internet.'));
  },
  'sync-signout': async () => {
    if (!(await ask('Sign out of the shared board?\n\nIncidents stay on this device, but changes stop going to the EOC until you sign in again.', 'Sign out'))) return;
    stopListening();
    sync.adapter.signOut().catch(() => {});
    closeModal();
  },
};

document.addEventListener('click', e => {
  unlockAudio();
  const b = e.target.closest('[data-action]');
  if (!b || !actions[b.dataset.action]) return;
  e.preventDefault();
  actions[b.dataset.action](b, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#confirm-root').innerHTML === '' && $('#modal-root').innerHTML) closeModal();
  if (e.key === 'Enter' && e.target.id === 'f-note' && e.target.tagName === 'INPUT') { e.preventDefault(); $('[data-action="add-note"]').click(); }
});

$('#import-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { mergeBackup(rd.result); } catch (err) { toast('That file is not a valid tracker backup'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

// Offline support for the installed (GitHub) version
if (window.IC_PWA && !testAdapter() && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
startSync();
})();
</script>
